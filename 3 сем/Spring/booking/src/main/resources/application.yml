server:
  port: 8082
spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:booking;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
app:
  jwt-secret: ${JWT_SECRET:local-demo-jwt-secret-at-least-32-characters}
  internal-secret: ${INTERNAL_SECRET:local-demo-internal-secret}
  hotel-url: ${HOTEL_URL:http://hotel-service}
