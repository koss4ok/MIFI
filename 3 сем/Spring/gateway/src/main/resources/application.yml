server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: booking
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**,/api/users/**,/api/auth/**
            - id: hotel
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/**,/api/rooms/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
